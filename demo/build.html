<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a workout · PWF</title>
  <meta name="description" content="Build a simple workout in the Portable Workout Format, then play it or share it as a link.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Portable Workout Format">
  <meta property="og:title" content="Build a workout · PWF">
  <meta property="og:description" content="Build a simple workout in the Portable Workout Format, then play it or share it as a link.">
  <meta property="og:url" content="https://portableworkout.org/build/">
  <meta property="og:image" content="https://portableworkout.org/brand/pwf-social.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="The PWF logo, a heartbeat in curly braces, with the words: Workouts your AI can write and any app can play.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1e1c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../brand/pwf-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
  <link rel="manifest" href="../site.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="../"><svg class="brand-mark" viewBox="2 2 60 60" aria-hidden="true"><path d="M16 12H13C10.52 12 8.5 14.02 8.5 16.5V26.5C8.5 29.8 6.5 32 5 32C6.5 32 8.5 34.2 8.5 37.5V47.5C8.5 49.98 10.52 52 13 52H16M48 12H51C53.48 12 55.5 14.02 55.5 16.5V26.5C55.5 29.8 57.5 32 59 32C57.5 32 55.5 34.2 55.5 37.5V47.5C55.5 49.98 53.48 52 51 52H48"/><path class="pulse" d="M16 32.5L22.55 32.5L26.91 18.5L33.45 46.5L39.27 23.6L42.91 32.5L48 32.5"/></svg><span>PWF</span> <span class="brand-name">Portable Workout Format</span></a>
    <nav>
      <a href="../">Use with AI</a>
      <a href="build.html" aria-current="page">Build</a>
      <a href="play.html">Play</a>
      <a href="https://github.com/portableworkoutformat/pwf">GitHub</a>
    </nav>
  </header>
  <main>
    <div class="builder">
      <div class="stack">
        <div class="card stack">
          <div class="row" style="justify-content: space-between">
            <h1>Build a workout</h1>
            <div class="row">
              <select id="template" aria-label="Start from a template">
                <option value="">Start from…</option>
              </select>
              <button id="open-file" type="button">Open file</button>
              <button id="new" type="button">New</button>
              <input id="file" type="file" accept=".json,application/json" class="hidden">
            </div>
          </div>
          <div>
            <label for="name">Name</label>
            <input id="name" placeholder="e.g. Lunchtime HIIT" maxlength="200">
          </div>
          <div>
            <label for="description">Description</label>
            <textarea id="description" rows="2" placeholder="What the workout is and who it's for"></textarea>
          </div>
        </div>
        <p id="message" class="notice hidden" role="status"></p>
        <div id="sections" class="stack"></div>
        <button id="add-section" type="button">+ Add section</button>
      </div>
      <aside class="summary card stack" aria-label="Summary">
        <div>
          <div class="muted small">Total time</div>
          <div id="total" class="total">0:00</div>
          <div id="total-note" class="muted small"></div>
        </div>
        <div id="problems-box" class="notice hidden">
          <ul id="problems" class="small" style="margin: 0; padding-left: 1.1rem"></ul>
        </div>
        <div class="stack">
          <button id="try" type="button" class="primary" style="width: 100%">▶ Try it in the player</button>
          <button id="export" type="button" style="width: 100%">Download .pwf.json</button>
          <button id="copy-link" type="button" style="width: 100%">Copy share link</button>
        </div>
        <details>
          <summary class="small">PWF JSON</summary>
          <pre id="json"></pre>
        </details>
      </aside>
    </div>
  </main>
  <datalist id="exercise-names"></datalist>
  <script type="module" src="build.js"></script>
</body>
</html>
