<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PWF social preview</title>
<!-- The source of pwf-social.png (1280 × 640). README.md says how to render it. -->
<style>
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; box-sizing: border-box; padding: 96px 104px;
    display: flex; align-items: center; gap: 72px;
    background: #f6f5f2; color: #1d1d1b;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  img { width: 300px; height: 300px; flex: none; }
  .name { font-size: 40px; font-weight: 700; margin: 0 0 20px; }
  .name span { color: #d9481e; }
  h1 { font-size: 72px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 32px; }
  h1 em { font-style: normal; color: #d9481e; }
  .url { font-size: 32px; color: #6b6a66; margin: 0; }
</style>
</head>
<body>
  <img src="pwf-mark.svg" alt="">
  <div>
    <p class="name"><span>PWF</span> Portable Workout Format</p>
    <h1>Workouts your AI can write <em>and any app can play</em>.</h1>
    <p class="url">portableworkout.org</p>
  </div>
</body>
</html>
